# BlacTec Technologies — static site, served by Nginx.
# Install to /etc/nginx/sites-available/blactec.conf, then:
#   sudo ln -s /etc/nginx/sites-available/blactec.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# See ../README.md for full server setup (including certbot for the 443 block).

server {
    listen 80;
    listen [::]:80;
    server_name blactec.ug www.blactec.ug;

    root /var/www/blactec-site;
    index index.html;

    # certbot --nginx (see README) rewrites this block to redirect to 443
    # and adds its own server{} block with ssl_certificate directives.
    # Until TLS is issued, this serves plain HTTP.

    access_log /var/log/nginx/blactec.access.log;
    error_log  /var/log/nginx/blactec.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny dotfiles (.git, .env, etc.) if ever present in the web root.
    location ~ /\. {
        deny all;
    }

    # Clean URLs: every page's own links point at the extension-less form
    # (e.g. /hosting), and canonical/sitemap URLs match. Anyone hitting the
    # old *.html URL gets redirected to it, so there's one canonical URL per
    # page rather than two indexable duplicates.
    location = /index.html {
        return 301 /;
    }
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # CSS/JS carry a ?v=<version> cache-buster (see package.json), so it's
    # safe to cache them aggressively — a version bump changes the URL.
    location ~ \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images and other static assets.
    location ~ \.(?:png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    # Pages: /hosting resolves to hosting.html on disk (extension hidden from
    # the URL), always revalidated so a redeploy is visible immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html =404;
    }

    # Soft 404: keep the real 404 status, but show the homepage instead of a
    # blank error page. Goes through normal location matching, but "/" only
    # ever reaches the try_files block above (never the *.html redirect).
    error_page 404 /;
}
