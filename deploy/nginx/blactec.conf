# BlacTec Technologies — static site, served by Nginx.
# Install to /etc/nginx/sites-available/blactec.conf, then:
#   sudo ln -s /etc/nginx/sites-available/blactec.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# See ../README.md for full server setup (including certbot for the 443 block).

server {
    listen 80;
    listen [::]:80;
    server_name blactec.ug www.blactec.ug;

    root /var/www/blactec-site;
    index index.html;

    # certbot --nginx (see README) rewrites this block to redirect to 443
    # and adds its own server{} block with ssl_certificate directives.
    # Until TLS is issued, this serves plain HTTP.

    access_log /var/log/nginx/blactec.access.log;
    error_log  /var/log/nginx/blactec.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny dotfiles (.git, .env, etc.) if ever present in the web root.
    location ~ /\. {
        deny all;
    }

    # HTML documents: always revalidate, never serve a stale page.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # CSS/JS carry a ?v=<version> cache-buster (see package.json), so it's
    # safe to cache them aggressively — a version bump changes the URL.
    location ~ \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images and other static assets.
    location ~ \.(?:png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    location / {
        try_files $uri $uri.html =404;
    }

    error_page 404 /index.html;
}
